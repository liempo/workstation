# Fix Colors
set -g extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Scrolling
set -g mouse on
set -g history-limit 102400

# Window Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status Bar
set-option -g status-keys emacs
setw -g mode-keys vi
set -g escape-time 10

# Prefix
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Vim keybinds for pane switching
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Bind prefix + H to move to the previous window
bind-key H previous-window
# Bind prefix + jj to move to the next window
bind-key L next-window

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# NeoGotham — https://gitlab.com/shmerl/neogotham
set -g mode-style "fg=#99d1ce,bg=#0a3749"
set -g message-style "fg=#99d1ce,bg=#0a3749"
set -g message-command-style "fg=#99d1ce,bg=#0a3749"
set -g pane-border-style "fg=#0a3749"
set -g pane-active-border-style "fg=#599cab"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#599cab,bg=#091f2e"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#0c1014,bg=#599cab,bold] #S #[fg=#599cab,bg=#091f2e,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#091f2e,bg=#091f2e,nobold,nounderscore,noitalics]#[fg=#599cab,bg=#091f2e] #{prefix_highlight} #[fg=#0a3749,bg=#091f2e,nobold,nounderscore,noitalics]#[fg=#599cab,bg=#0a3749] %Y-%m-%d  %I:%M %p #[fg=#599cab,bg=#0a3749,nobold,nounderscore,noitalics]#[fg=#0c1014,bg=#599cab,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#091f2e,bg=#091f2e,nobold,nounderscore,noitalics]#[fg=#599cab,bg=#091f2e] #{prefix_highlight} #[fg=#0a3749,bg=#091f2e,nobold,nounderscore,noitalics]#[fg=#599cab,bg=#0a3749] %Y-%m-%d  %H:%M #[fg=#599cab,bg=#0a3749,nobold,nounderscore,noitalics]#[fg=#0c1014,bg=#599cab,bold] #h "
}
setw -g window-status-activity-style "underscore,fg=#99d1ce,bg=#091f2e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#99d1ce,bg=#091f2e"
setw -g window-status-format "#[fg=#091f2e,bg=#091f2e,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#091f2e,bg=#091f2e,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#091f2e,bg=#0a3749,nobold,nounderscore,noitalics]#[fg=#99d1ce,bg=#0a3749,bold] #I  #W #F #[fg=#0a3749,bg=#091f2e,nobold,nounderscore,noitalics]"
set -g @prefix_highlight_output_prefix "#[fg=#edb443]#[bg=#091f2e]#[fg=#0c1014]#[bg=#edb443]"
set -g @prefix_highlight_output_suffix ""

# Plugin manager initialization
run '~/.config/tmux/plugins/tpm/tpm'

